<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Health Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
    <header class="header border-bottom pt-3 pb-3">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4 col-sm-12">
                    <p>Welcome to a Professional Health Care</p>
                </div>
                <div class="col-md-8 col-sm-12 text-end">
                    <span class="phone-icon">
                        <i class="bi bi-telephone-fill pe-1"></i>010-060-0160
                    </span>
                    <span class="celender-icosn border-start ps-2 ">
                        <i class="bi bi-clock pe-1"></i>6:00 AM - 10:00 PM (Mon-Fri)
                    </span>
                    <span class="mail-icon border-start ps-2">
                        <i classs="bi bi-envelope pe-1"> </i>info@company.com
                    </span>
                </div>
            </div>
        </div>
    </header>

    <nav class="navbar navbar-expand-lg bg-body-tertiary pt-3 pb-3 nav-bar">
        <div class="container">
            <a class="navbar-brand" href="index.html">Health Center</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item ps-3">
                        <a href="index.html" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item ps-3">
                        <a class="nav-link" href="#">About us</a>
                    </li>
                    <li class="nav-item ps-3">
                        <a class="nav-link" href="#">Doctor</a>
                    </li>
                    <li class="nav-item ps-3">
                        <a class="nav-link" href="#">News</a>
                    </li>
                    <li class="nav-item ps-3">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                    <li class="nav-item ps-3">
                        <a class="btn btn-md btn-success py-2" href="#">Make an appointment</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="login-page">
        <div class="container">
            <div class="login-card shadow-sm">
                <h2>Login to Your Account</h2>
                <form action="#" method="post">
                    <div class="mb-4">
                        <label class="form-label" for="email">Email address</label>
                        <input type="email" class="form-control form-control-lg" id="email" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" placeholder="Enter password" required>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                        <a href="#" class="text-decoration-none">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg">Login</button>
                </form>
                <div class="login-footer">
                    <p class="mb-0">Don’t have an account? <a href="#">Register now</a></p>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
